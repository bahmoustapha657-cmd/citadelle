  <!-- Petits signes entre les motifs -->
  <path d="M118 62 h10 M123 57 v10"/>
  <path d="M226 92 h9 M230.5 87.5 v9"/>
  <path d="M26 132 l7 7 M33 132 l-7 7"/>
  <path d="M276 212 l7 7 M283 212 l-7 7"/>
  <path d="M222 322 h9 M226.5 317.5 v9"/>
  <circle cx="176" cy="118" r="2.6"/>
  <circle cx="120" cy="226" r="2.6"/>
  <circle cx="30" cy="268" r="2.6"/>
  <circle cx="336" cy="232" r="2.6"/>
  <circle cx="140" cy="340" r="2.6"/>
  <circle cx="226" cy="30" r="2.6"/>
