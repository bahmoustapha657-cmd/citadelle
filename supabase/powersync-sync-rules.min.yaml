config:
  edition: 3
  timestamps_iso8601: false
  fixed_json_extract: false
  custom_postgres_types: false
streams:
  school_data:
    auto_subscribe: true
    priority: 1
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND role != 'parent'
    queries:
      - SELECT * FROM eleves WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM classes WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM matieres WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM enseignants WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM emplois WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM enseignements WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM appreciations WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM ecoles WHERE id IN ecole_du_compte
      - SELECT * FROM annonces WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM postes WHERE ecole_id IN ecole_du_compte
  teacher_notes:
    auto_subscribe: true
    priority: 2
    with:
      sections_enseignant: SELECT section, ecole_id FROM enseignant_classes WHERE user_id = auth.user_id()
    queries:
      - SELECT notes.* FROM notes, sections_enseignant AS ec WHERE notes.ecole_id = ec.ecole_id AND notes.section = ec.section
      - SELECT absences.* FROM absences, sections_enseignant AS ec WHERE absences.ecole_id = ec.ecole_id AND absences.section = ec.section
  staff_notes:
    auto_subscribe: true
    priority: 2
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND role != 'parent' AND role != 'enseignant'
    queries:
      - SELECT * FROM notes WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM absences WHERE ecole_id IN ecole_du_compte
  compta_data:
    auto_subscribe: true
    priority: 1
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_compta = true
    queries:
      - SELECT * FROM recettes WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM depenses WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM versements WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM bons WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM personnel WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM salaires WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM tarifs WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM paiements WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM presences WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM paie_enseignants WHERE ecole_id IN ecole_du_compte
  calendrier_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_calendrier = true
    queries:
      - SELECT * FROM evenements WHERE ecole_id IN ecole_du_compte
  examens_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_examens = true
    queries:
      - SELECT * FROM examens WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM livrets WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM honneurs WHERE ecole_id IN ecole_du_compte
  messages_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_messages = true
    queries:
      - SELECT * FROM messages WHERE ecole_id IN ecole_du_compte
  fondation_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_fondation = true
    queries:
      - SELECT * FROM membres WHERE ecole_id IN ecole_du_compte
      - SELECT * FROM documents WHERE ecole_id IN ecole_du_compte
  historique_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_historique = true
    queries:
      - SELECT * FROM historique WHERE ecole_id IN ecole_du_compte
  admin_data:
    auto_subscribe: true
    priority: 3
    with:
      ecole_du_compte: SELECT ecole_id FROM comptes WHERE user_id = auth.user_id() AND perm_admin_panel = true
    queries:
      - SELECT * FROM comptes WHERE ecole_id IN ecole_du_compte
