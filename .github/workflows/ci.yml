name: CI

on:
  push:
  pull_request:
  # Mise en production : onglet Actions → « CI » → Run workflow (branche
  # master) : migrations SQL en attente PUIS front (cf. docs/deploiement.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 : exigé par engines (package.json) depuis 7909c31, et surtout
      # par « npm run test » — le motif glob passé à --test n'est résolu par le
      # test runner qu'à partir de Node 22. Sous Node 20 il était pris pour un
      # chemin littéral (« Could not find .../tests/**/*.test.{js,ts} »), ce qui
      # faisait échouer le job à chaque push sans qu'aucun test ne soit exécuté.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Le bundle réellement mis en production (Cloudflare Pages, edugest-gn) :
      # c'est ce dist/ qui est transmis au job de déploiement.
      - name: Build (bundle deploye)
        run: npm run build:supabase

      - name: Conserver le bundle à déployer
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dist-supabase
          path: dist
          retention-days: 30
          if-no-files-found: error

  # Parcours critiques de bout en bout (e2e/) : le vrai front, construit
  # contre un Supabase LOCAL complet (migrations, auth, API, Edge Functions)
  # démarré dans le runner, piloté dans Chromium. Aucun accès à la production.
  # Deux variantes : « en-ligne » (écritures directes vers Supabase) et
  # « hors-ligne » (miroir PowerSync, comme en production : service PowerSync
  # local, mêmes règles de synchro). BLOQUANT pour le déploiement.
  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [en-ligne, hors-ligne]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0  # épinglée : « latest » interroge l API GitHub (rate limit), cf. docs/deploiement.md

      # Base vierge + toutes les migrations + Edge Functions servies en local.
      # PAIEMENT_SIMULATION : fournisseur de paiement « simulation » autorisé
      # sur cette pile jetable seulement (jamais posé en production).
      - name: Démarrer Supabase local
        run: |
          echo "PAIEMENT_SIMULATION=autorisee" > supabase/functions/.env
          supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta

      # Clés de la pile LOCALE (valeurs de démonstration publiques de la CLI).
      - name: Variables de la base locale
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_ANON_KEY=$ANON_KEY"
            echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_JWT_SECRET=$JWT_SECRET"
            echo "E2E_MODE=${{ matrix.mode }}"
          } >> "$GITHUB_ENV"

      # Mode hors ligne : service PowerSync local (même version que la prod),
      # réplication par powersync_role comme en production, stockage des
      # buckets dans un Postgres jetable.
      - name: Service PowerSync local
        if: matrix.mode == 'hors-ligne'
        run: |
          docker exec -e PGPASSWORD=postgres supabase_db_edugest psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "alter role powersync_role with login replication bypassrls password 'powersync-ci'"
          reseau=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' supabase_db_edugest)
          # Clés publiques de signature des jetons (lues par PowerSync via Kong).
          curl -fsS "$E2E_SUPABASE_URL/auth/v1/.well-known/jwks.json" | head -c 300; echo
          docker run -d --name ps-stockage --network "$reseau" \
            -e POSTGRES_PASSWORD=stockage -e POSTGRES_DB=powersync_storage postgres:16
          for i in $(seq 1 30); do docker exec ps-stockage pg_isready -U postgres -q && break; sleep 1; done
          docker run -d --name powersync --network "$reseau" -p 8080:8080 \
            -v "$PWD/e2e/powersync:/config:ro" -v "$PWD/supabase:/regles:ro" \
            -e POWERSYNC_CONFIG_PATH=/config/powersync.yaml \
            -e PS_DATA_SOURCE_URI="postgresql://powersync_role:powersync-ci@supabase_db_edugest:5432/postgres" \
            -e PS_STORAGE_URI="postgresql://postgres:stockage@ps-stockage:5432/powersync_storage" \
            -e PS_SUPABASE_JWT_SECRET="$E2E_JWT_SECRET" \
            -e PS_JWKS_URI="http://supabase_kong_edugest:8000/auth/v1/.well-known/jwks.json" \
            journeyapps/powersync-service:1.26.1 start -r unified
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/probes/liveness || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs --tail 30 powersync
          [ "$code" = "200" ] || { echo "::error::Service PowerSync local injoignable"; exit 1; }
          echo "E2E_POWERSYNC_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"

      # Le build de production, mais pointé sur la base locale (les variables
      # d'environnement priment sur .env.supabase) et, en mode hors ligne, sur
      # le PowerSync local ; vide = chemin « en ligne ».
      - name: Build du front contre la base locale
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ env.E2E_POWERSYNC_URL }}
        run: npm run build:supabase

      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium

      - name: Parcours de bout en bout
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Journaux des Edge Functions (en cas d'échec)
        if: failure()
        run: docker logs --tail 200 "$(docker ps --format '{{.Names}}' | grep edge_runtime | head -1)" || true

      - name: Journaux PowerSync (en cas d'échec)
        if: failure() && matrix.mode == 'hors-ligne'
        run: docker logs --tail 300 powersync || true

      # Rapport HTML + traces Playwright (données de TEST uniquement).
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e-${{ matrix.mode }}
          path: |
            e2e/rapport
            e2e/resultats
          retention-days: 7

  # Toutes les migrations (supabase/migrations) rejouées dans l'ordre sur une
  # base Supabase VIERGE et jetable (Postgres 17, schémas auth/storage), dans
  # le runner. Aucun accès à la production.
  migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0  # épinglée : « latest » interroge l API GitHub (rate limit), cf. docs/deploiement.md

      - name: Client psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)

      # `db start` crée la base locale et y applique les migrations.
      - name: Rejouer toutes les migrations sur une base vierge
        run: supabase db start

      - name: Contrôler la base obtenue
        env:
          LOCALE: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          attendues=$(ls supabase/migrations/*.sql | wc -l)
          appliquees=$(psql "$LOCALE" -Atc "select count(*) from supabase_migrations.schema_migrations")
          echo "Migrations : $appliquees appliquée(s) sur $attendues"
          test "$appliquees" -eq "$attendues"
          psql "$LOCALE" -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'tables public    : ' || count(*) from pg_tables where schemaname = 'public';
          select 'policies public  : ' || count(*) from pg_policies where schemaname = 'public';
          select 'policies storage : ' || count(*) from pg_policies where schemaname = 'storage';
          select 'buckets          : ' || count(*) from storage.buckets;
          -- Garde-fous : RLS active sur TOUTES les tables publiques, et la
          -- garde anti auto-promotion présente (faille du 2026-09-25).
          do $$
          declare sans_rls text;
          begin
            select string_agg(tablename, ', ') into sans_rls
              from pg_tables where schemaname = 'public' and not rowsecurity;
            if sans_rls is not null then
              raise exception 'Tables publiques SANS RLS : %', sans_rls;
            end if;
            if not exists (select 1 from pg_trigger where tgname ilike '%comptes%guard%') then
              raise exception 'Garde comptes_guard absente';
            end if;
          end $$;
          SQL

      # Une fiche élève qui porte de l'argent ne se supprime pas : la cascade
      # vidait le journal de caisse (migration 20261009151044). La suppression
      # d'une école entière, elle, emporte toujours tout. Données jetables,
      # annulées à la fin (rollback).
      - name: Contrôler la garde des encaissements
        env:
          LOCALE: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCALE" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          do $$
          declare
            ecole uuid := gen_random_uuid();
            journal uuid := gen_random_uuid();  -- une ligne au journal de caisse
            fiche uuid := gen_random_uuid();    -- un mois payé sur la fiche seulement
            archive uuid := gen_random_uuid();  -- inscription payée dans une année close
            libre uuid := gen_random_uuid();    -- rien d'encaissé
            cible uuid;
            indice text;
            etat text;
          begin
            insert into ecoles (id, code, nom) values (ecole, 'ci-garde-encaissements', 'CI');
            insert into eleves (id, ecole_id, section, nom, extra) values
              (journal, ecole, 'college', 'JOURNAL', '{}'),
              (fiche, ecole, 'college', 'FICHE', '{"mens": {"Oct": "Payé", "Nov": "Impayé"}}'),
              (archive, ecole, 'college', 'ARCHIVE', '{"historique": {"2025-2026": {"inscriptionPayee": true}}}'),
              (libre, ecole, 'college', 'LIBRE', '{"mens": {"Oct": "Impayé"}, "fraisPayes": {"tenue": false}, "inscriptionAcompte": 0}');
            insert into paiements (ecole_id, eleve_id, montant, statut, type, annee, mois)
              values (ecole, journal, 75000, 'encaisse', 'mensualite', '2026-2027', 'Oct');

            -- 1. service_role / SQL Editor : le journal protège sa fiche.
            indice := null;
            begin
              delete from eleves where id = journal;
              indice := 'supprimée';
            exception when others then
              get stacked diagnostics indice = pg_exception_hint;
            end;
            if indice is distinct from 'eleve_avec_encaissements' then
              raise exception 'Garde (service_role, journal) : %', indice;
            end if;

            -- 2. Sans la garde, la clé étrangère refuse encore (dernier filet).
            alter table eleves disable trigger trg_eleves_garde_suppression;
            etat := null;
            begin
              delete from eleves where id = journal;
              etat := 'supprimée';
            exception when foreign_key_violation then
              etat := 'refusée';
            end;
            alter table eleves enable trigger trg_eleves_garde_suppression;
            if etat is distinct from 'refusée' then
              raise exception 'paiements_eleve_id_fkey : fiche avec journal %', etat;
            end if;

            -- 3. Compte de l'appli : journal, fiche et archive protègent.
            perform set_config('request.jwt.claims', '{"role": "authenticated"}', true);
            foreach cible in array array[journal, fiche, archive] loop
              indice := null;
              begin
                delete from eleves where id = cible;
                indice := 'supprimée';
              exception when others then
                get stacked diagnostics indice = pg_exception_hint;
              end;
              if indice is distinct from 'eleve_avec_encaissements' then
                raise exception 'Garde (compte de l''appli) % : %', cible, indice;
              end if;
            end loop;

            -- 4. Rien d'encaissé : la fiche se supprime.
            delete from eleves where id = libre;
            if exists (select 1 from eleves where id = libre) then
              raise exception 'Garde : fiche sans encaissement non supprimée';
            end if;

            -- 5. L'école entière (super-admin) : tout part, journal compris.
            delete from ecoles where id = ecole;
            if exists (select 1 from eleves where ecole_id = ecole)
               or exists (select 1 from paiements where ecole_id = ecole) then
              raise exception 'Garde : la suppression de l''école n''a pas tout emporté';
            end if;

            select confdeltype into etat from pg_constraint where conname = 'paiements_eleve_id_fkey';
            if etat is distinct from 'a' then
              raise exception 'paiements_eleve_id_fkey : ON DELETE % (attendu NO ACTION)', etat;
            end if;
            raise notice 'Garde des encaissements : OK';
          end $$;
          rollback;
          SQL

  # Applique à la PRODUCTION les migrations pas encore passées, AVANT le
  # front : le nouveau front trouve toujours la base dont il a besoin.
  # Règle : une migration reste compatible avec le front encore en ligne
  # (ajouter avant de retirer — cf. docs/migrations-sql.md).
  migrations-production:
    # Parcours critiques (e2e) verts exigés : rien ne part en production —
    # ni la base ni le front — si l'encaissement ou les notes cassent.
    needs: [lint-and-build, migrations, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrations-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0  # épinglée : « latest » interroge l API GitHub (rate limit), cf. docs/deploiement.md

      - name: Client psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)

      - name: Appliquer les migrations en attente
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL absent (Settings → Environments → production)."
            exit 1
          fi
          locales=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort)
          baseline=$(echo "$locales" | head -1)
          distantes=$(psql "$SUPABASE_DB_URL" -Atc \
            "select version from supabase_migrations.schema_migrations order by 1" 2>/dev/null || true)
          # Sans baseline marquée « appliquée », db push la REJOUERAIT sur la
          # production : refus net.
          if ! echo "$distantes" | grep -qx "$baseline"; then
            echo "::error::Baseline $baseline non marquée en production. Lancer d'abord « Schéma production » avec l'action marquer-baseline (docs/migrations-sql.md)."
            exit 1
          fi
          # Retour arrière (re-run d'un ancien déploiement) : la production a
          # déjà des migrations plus récentes. On n'en annule jamais : front seul.
          inconnues=$(comm -13 <(echo "$locales") <(echo "$distantes"))
          if [ -n "$inconnues" ]; then
            echo "::notice::Retour arrière : migrations plus récentes déjà en production ($(echo $inconnues)) — aucune migration appliquée."
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
          {
            echo "### Migrations en production (5 dernières)"
            psql "$SUPABASE_DB_URL" -Atc "select version || ' ' || coalesce(name, '') from supabase_migrations.schema_migrations order by 1 desc limit 5"
          } >> "$GITHUB_STEP_SUMMARY"

  # Déploie EXACTEMENT le bundle qui vient de passer lint + tests + build,
  # construit depuis un checkout propre de master : plus de déploiement depuis
  # un poste (branche de travail, fichiers non commités, .env local).
  # Retour arrière : relancer (« Re-run all jobs ») un run de déploiement
  # précédent — il redéploie son propre commit (front seul, cf. ci-dessus).
  deploy-production:
    needs: [lint-and-build, migrations-production]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edugest-gn.pages.dev
    # Jamais deux déploiements en même temps ; un second attend le premier.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Récupérer le bundle testé
        uses: actions/download-artifact@v4
        with:
          name: dist-supabase
          path: dist

      - name: Vérifier que le bundle correspond au commit
        run: |
          test -f dist/index.html
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .propre == true' dist/version.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents (Settings → Environments → production)."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=edugest-gn --branch=master --commit-hash="$GITHUB_SHA"

      # La production sert-elle vraiment ce commit ? (version.json n'est
      # jamais mis en cache : _headers no-cache + exclu du service worker.)
      - name: Contrôler la version en ligne
        run: |
          for i in $(seq 1 20); do
            en_ligne=$(curl -fsS "https://edugest-gn.pages.dev/version.json?t=$(date +%s)" | jq -r .commit 2>/dev/null || true)
            if [ "$en_ligne" = "$GITHUB_SHA" ]; then
              echo "### ✅ EduGest en ligne : \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "En ligne : ${en_ligne:-?} — attendu : $GITHUB_SHA (essai $i/20)"
            sleep 6
          done
          echo "::error::La production ne sert pas le commit déployé."
          exit 1
