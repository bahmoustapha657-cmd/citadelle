name: Schéma production

# Action « photographier » (par défaut) : schéma Postgres de PRODUCTION
# (structure seule, aucune donnée), en LECTURE seule. Sert à créer la
# baseline de supabase/migrations, puis à détecter les écarts entre la
# production et les migrations (retouche faite dans le tableau de bord).
# Action « marquer-baseline » : opération unique, voir le job plus bas.
#
# Lancement : Actions → « Schéma production » → Run workflow.
# Prérequis : secret SUPABASE_DB_URL dans l'environnement « production »
# (cf. docs/migrations-sql.md).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "photographier = dump en lecture seule ; marquer-baseline = inscrire UNE fois la baseline comme déjà appliquée (n'écrit que dans supabase_migrations)"
        type: choice
        options: [photographier, marquer-baseline]
        default: photographier

permissions:
  contents: read

jobs:
  # Opération UNIQUE, à lancer depuis master une fois la baseline fusionnée :
  # inscrit la baseline dans l'historique des migrations de la production,
  # pour que la CI ne la rejoue JAMAIS. N'écrit que dans
  # supabase_migrations.schema_migrations (aucune table d'EduGest touchée).
  marquer-baseline:
    if: inputs.action == 'marquer-baseline' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Client psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)

      - name: Marquer la baseline comme déjà appliquée
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          baseline=$(ls supabase/migrations/*.sql | xargs -n1 basename | sort | head -1 | cut -d_ -f1)
          echo "Baseline : $baseline"
          distantes=$(psql "$SUPABASE_DB_URL" -Atc \
            "select version from supabase_migrations.schema_migrations order by 1" 2>/dev/null || true)
          if echo "$distantes" | grep -qx "$baseline"; then
            echo "::notice::Baseline $baseline déjà marquée : rien à faire."
            exit 0
          fi
          if [ -n "$distantes" ]; then
            echo "::error::Historique de migrations inattendu en production ($(echo $distantes)) : arrêt, à examiner."
            exit 1
          fi
          # La production doit bien contenir le schéma décrit par la baseline
          # (sinon marquer reviendrait à prétendre l'avoir appliquée).
          present=$(psql "$SUPABASE_DB_URL" -Atc \
            "select count(*) from pg_trigger where tgname = 'trg_comptes_guard'")
          tables=$(psql "$SUPABASE_DB_URL" -Atc \
            "select count(*) from pg_tables where schemaname = 'public'")
          echo "Tables publiques en production : $tables ; garde comptes_guard : $present"
          if [ "$present" != "1" ] || [ "$tables" -lt 50 ]; then
            echo "::error::La production ne ressemble pas à la baseline : marquage refusé."
            exit 1
          fi
          supabase migration repair "$baseline" --status applied --db-url "$SUPABASE_DB_URL" --yes
          psql "$SUPABASE_DB_URL" -Atc "select version from supabase_migrations.schema_migrations order by 1" | grep -qx "$baseline"
          echo "### ✅ Baseline \`$baseline\` marquée comme appliquée en production" >> "$GITHUB_STEP_SUMMARY"

  dump:
    if: inputs.action != 'marquer-baseline'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Vérifier le secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL absent (Settings → Environments → production)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Client psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)

      # Forme de l'adresse, en oui/non UNIQUEMENT : GitHub masque le secret
      # entier, pas ses morceaux (mot de passe seul) — rien n'en est affiché.
      - name: Diagnostic de l'adresse (sans la révéler)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          # Découpage à la main (pas urlsplit, qui lève une erreur sur des
          # crochets laissés dans le mot de passe).
          import os, re, urllib.parse as u
          brut = os.environ["SUPABASE_DB_URL"]
          s = brut.strip()
          oui = lambda b: "OUI" if b else "non"
          print("Espace ou retour à la ligne autour    :", oui(brut != s))
          print("Entourée de guillemets                :", oui(s[:1] in ("\"", "'")))
          s = s.strip("\"'")
          schema, _, reste = s.partition("://")
          identifiants, arobase, hote = reste.rpartition("@")
          utilisateur, _, mdp = identifiants.partition(":")
          hote_port = re.split(r"[/?]", hote, maxsplit=1)[0]
          print("Commence par postgresql://            :", oui(schema in ("postgresql", "postgres")))
          print("Plus d'un @ (caractère non encodé ?)  :", oui(reste.count("@") > 1))
          print("Utilisateur = postgres.<ref du projet>:", oui(utilisateur == "postgres.pfzanslrcowkjjipuzpa"))
          print("Hôte = pooler Supabase, port 5432     :", oui(bool(re.fullmatch(r"aws-\d+-[a-z0-9-]+\.pooler\.supabase\.com:5432", hote_port))))
          print("Base = /postgres                      :", oui(hote[len(hote_port):].split("?")[0] == "/postgres"))
          print("Mot de passe présent                  :", oui(bool(mdp)))
          print("Crochets [ ] autour du mot de passe   :", oui("[" in mdp or "]" in mdp))
          print("Contient YOUR-PASSWORD                :", oui("YOUR-PASSWORD" in mdp.upper()))
          print("Caractère à encoder laissé tel quel   :", oui(bool(re.search(r"[#?/ @]", mdp))))
          print("Contient des %xx (déjà encodé)        :", oui(bool(re.search(r"%[0-9A-Fa-f]{2}", mdp))))
          print("Caractères spéciaux (une fois décodé) :", oui(bool(re.search(r"[^A-Za-z0-9]", u.unquote(mdp)))))
          PY

      - name: Version du serveur
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          v=$(psql "$SUPABASE_DB_URL" -Atc "show server_version")
          echo "Postgres en production : $v"
          echo "### Postgres en production : \`$v\`" >> "$GITHUB_STEP_SUMMARY"

      # Schéma « public » + objets créés par EduGest. Les schémas gérés par
      # Supabase (auth, storage, realtime…) sont exclus par la CLI.
      - name: Dump du schéma (lecture seule)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p sortie
          supabase db dump --db-url "$SUPABASE_DB_URL" -f sortie/schema.sql
          # Politiques et buckets de Storage + publications Realtime : hors du
          # dump ci-dessus, relevés séparément pour la baseline.
          psql "$SUPABASE_DB_URL" -At -F $'\t' -f - > sortie/hors-public.tsv <<'SQL'
          select 'bucket', id, public::text, coalesce(file_size_limit::text, ''), coalesce(array_to_string(allowed_mime_types, ','), '')
            from storage.buckets order by id;
          select 'policy_storage', policyname, cmd, array_to_string(roles, ','), coalesce(qual, '') || ' || ' || coalesce(with_check, '')
            from pg_policies where schemaname = 'storage' order by policyname;
          select 'publication', pubname, schemaname || '.' || tablename, '', ''
            from pg_publication_tables order by pubname, tablename;
          select 'trigger_auth', tgname, tgrelid::regclass::text, '', ''
            from pg_trigger where tgrelid::regclass::text like 'auth.%' and not tgisinternal;
          select 'extension', extname, extversion, '', '' from pg_extension order by extname;
          SQL
          wc -l sortie/*

      # Dépôt PUBLIC : l'artefact est téléchargeable par d'autres. On refuse
      # de le publier s'il contient quoi que ce soit qui ressemble à un secret
      # (seuls les numéros de ligne sont affichés).
      - name: Contrôle anti-secret
        run: |
          motifs='eyJ[A-Za-z0-9_-]{20,}\.|sbp_[A-Za-z0-9]{20,}|sk_(live|test)_[A-Za-z0-9]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*(=|:=)[[:space:]]*'"'"'[^'"'"']{6,}'
          if grep -qEi "$motifs" sortie/*; then
            grep -nHEi "$motifs" sortie/* | cut -d: -f1,2
            echo "::error::Motif ressemblant à un secret trouvé (lignes ci-dessus) : artefact NON publié."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: schema-production
          path: sortie
          retention-days: 1
          if-no-files-found: error
