# Compile l'application Android. Sur une PR : contrôle, sans clé ni Firebase si
# les secrets manquent. Lancé à la main sur master : APK signé, publié dans les
# Releases du dépôt s'il s'ouvre sur émulateur. Procédure : docs/application-android.md.
name: Application Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "scripts/essai-android.sh"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Poser les fichiers secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/edugest.keystore; fi

      - name: Compiler
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Afficher l'empreinte de la clé (publique, pour assetlinks.json)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f android/app/edugest.keystore ]; then
            keytool -list -v -keystore android/app/edugest.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep "SHA256:"
          fi

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: edugest-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # Ouvre vraiment l'application sur un téléphone virtuel, ancien et récent.
  demarrage:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: edugest-android
          path: apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ouvrir l'application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: bash scripts/essai-android.sh

      - name: Garder les captures et le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essai-android-${{ matrix.api }}
          path: essai
          retention-days: 14

  # Après l'essai seulement : une version qui ne s'ouvre pas ne part jamais.
  publier:
    needs: demarrage
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: edugest-android
          path: apk

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$CLE"
          cp apk/*.apk edugest.apk
          gh release create "android-${{ github.run_number }}" edugest.apk --repo "$GITHUB_REPOSITORY" --latest \
            --title "EduGest Android ${{ github.run_number }}" --notes "Application Android d'EduGest."
